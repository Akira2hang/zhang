<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵魂拷问</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    max-width: 680px;
    width: 100%;
    padding: 48px 40px 44px;
    text-align: center;
  }
  .question {
    color: #ffffff;
    font-size: clamp(26px, 5.5vw, 42px);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    margin-bottom: 10px;
  }
  .hint {
    color: rgba(255, 255, 255, 0.85);
    font-size: 15px;
    margin-bottom: 34px;
    min-height: 22px;
    transition: opacity 0.2s ease;
  }
  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    flex-wrap: nowrap;
    min-height: 90px;
  }
  .btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 24px;
    line-height: 1;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
    transition: font-size 0.25s ease, padding 0.25s ease,
                opacity 0.25s ease, transform 0.15s ease,
                left 0.2s ease, top 0.2s ease;
    white-space: nowrap;
    max-width: 90vw;
  }
  .btn:active { transform: translateY(2px) scale(0.97); }
  .btn.yes {
    background: #ffffff;
    color: #6a11cb;
    padding: 14px 48px;
  }
  .btn.no {
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    color: #7c2d3a;
    padding: 14px 48px;
  }

  /* 弹窗 */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .modal[hidden] { display: none; }
  .modal-card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    padding: 40px 44px 34px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    animation: pop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  .modal-emoji { font-size: 64px; line-height: 1; margin-bottom: 16px; }
  .modal-text {
    font-size: 34px;
    font-weight: 800;
    color: #d03b3b;
    letter-spacing: 2px;
    margin-bottom: 26px;
  }
  .modal-actions { display: flex; justify-content: center; gap: 12px; }
  .modal-btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border-radius: 999px;
    padding: 10px 26px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .modal-btn:active { transform: scale(0.95); }
  .modal-ok { background: #d03b3b; color: #ffffff; }
  .modal-restart { background: #f0f0f0; color: #52514e; }
  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 520px) {
    .card { padding: 38px 22px 36px; }
    .buttons { gap: 18px; }
    .btn.yes, .btn.no { padding: 13px 34px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1 class="question">白煜睿是不是最帅的？</h1>
    <p class="hint" id="hint">请诚实回答 👇</p>
    <div class="buttons">
      <button class="btn yes" id="btnYes">是</button>
      <button class="btn no" id="btnNo">不是</button>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-emoji">🤢</div>
      <p class="modal-text">白煜睿真恶心！</p>
      <div class="modal-actions">
        <button class="modal-btn modal-ok" id="modalOk">好吧</button>
        <button class="modal-btn modal-restart" id="modalRestart">再来一次 ↻</button>
      </div>
    </div>
  </div>

<script>
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const hint = document.getElementById('hint');
  const modal = document.getElementById('modal');
  const modalOk = document.getElementById('modalOk');
  const modalRestart = document.getElementById('modalRestart');

  const BASE_FONT = 24;
  const SHRINK = 0.78;      // "是"每次点击缩小到 78%
  const GROW = 1.22;        // "不是"每次点击放大到 122%
  const MAX_FONT = 72;      // "不是"最大字号
  const RUNAWAY_FONT = 13;  // "是"缩小到该字号以下时开始乱跑
  const RUN_MIN_FONT = 8;   // 乱跑时"是"的字号下限(不再直接消失)
  const HINTS = [
    '真的吗？再想想… 🤔',
    '你确定？仔细看看 👀',
    '最后一次机会了！',
    '其实只有"不是"能点哦 😏',
  ];
  const RUNAWAY_HINTS = [
    '哎呀，它跑掉了！😝',
    '快来抓我呀～',
    '点在空气上好玩吗？',
    '追不上吧！',
  ];

  let clicks = 0;
  let running = false;
  let runTimer = null;   // 乱跑模式下的自动移动定时器

  function setSize(btn, fontPx, padY, padX) {
    btn.style.fontSize = fontPx + 'px';
    btn.style.padding = padY + 'px ' + padX + 'px';
  }

  // 把按钮丢到屏幕上的随机位置(每点一次跑一次)
  function dartAway(btn) {
    const w = btn.offsetWidth || 60;
    const h = btn.offsetHeight || 36;
    const maxX = Math.max(window.innerWidth - w, 0);
    const maxY = Math.max(window.innerHeight - h, 0);
    btn.style.left = Math.random() * maxX + 'px';
    btn.style.top = Math.random() * maxY + 'px';
  }

  btnYes.addEventListener('click', () => {
    clicks += 1;

    // "是"：越变越小;小到一定程度开始乱跑,不再直接消失
    const yesFont = Math.max(BASE_FONT * Math.pow(SHRINK, clicks), RUN_MIN_FONT);
    const yesPadY = Math.max(14 * Math.pow(SHRINK, clicks), 3);
    const yesPadX = Math.max(48 * Math.pow(SHRINK, clicks), 8);
    setSize(btnYes, yesFont, yesPadY, yesPadX);

    if (!running && yesFont <= RUNAWAY_FONT) {
      running = true;
      btnYes.style.position = 'fixed';
      btnYes.style.zIndex = '50';
      btnYes.style.margin = '0';
      dartAway(btnYes);
      // 进入乱跑模式:持续自动移动,直到点"不是"才停下
      let dartCount = 0;
      runTimer = setInterval(() => {
        dartAway(btnYes);
        dartCount += 1;
        if (dartCount % 4 === 0) {
          hint.textContent = RUNAWAY_HINTS[Math.floor(Math.random() * RUNAWAY_HINTS.length)];
        }
      }, 350);
    }
    if (running) {
      dartAway(btnYes);
      hint.textContent = RUNAWAY_HINTS[Math.floor(Math.random() * RUNAWAY_HINTS.length)];
    } else {
      hint.textContent = HINTS[Math.min(clicks - 1, HINTS.length - 1)];
    }

    // "不是"：越变越大
    const noFont = Math.min(BASE_FONT * Math.pow(GROW, clicks), MAX_FONT);
    const noPadY = Math.min(14 * Math.pow(GROW, clicks), 22);
    const noPadX = Math.min(48 * Math.pow(GROW, clicks), 72);
    setSize(btnNo, noFont, noPadY, noPadX);
  });

  btnNo.addEventListener('click', () => {
    if (runTimer) clearInterval(runTimer);
    modal.hidden = false;
  });

  modalOk.addEventListener('click', () => {
    modal.hidden = true;
  });

  modalRestart.addEventListener('click', () => {
    location.reload();
  });
</script>
</body>
</html>
